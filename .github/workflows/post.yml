name: post-to-x

on:
  schedule:
    - cron: "0 4,8,10,14,18,20 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: tweet-bot
      cancel-in-progress: false

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install deps
        run: npm install

      - name: random sleep (0-90s)
        run: sleep $(( RANDOM % 90 ))

      - name: run bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TWITTER_API_KEY_GPT: ${{ secrets.TWITTER_API_KEY_GPT }}
          TWITTER_API_SECRET_GPT: ${{ secrets.TWITTER_API_SECRET_GPT }}
          TWITTER_ACCESS_TOKEN_GPT: ${{ secrets.TWITTER_ACCESS_TOKEN_GPT }}
          TWITTER_ACCESS_SECRET_GPT: ${{ secrets.TWITTER_ACCESS_SECRET_GPT }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          TWITTER_API_KEY_CLAUDE: ${{ secrets.TWITTER_API_KEY_CLAUDE }}
          TWITTER_API_SECRET_CLAUDE: ${{ secrets.TWITTER_API_SECRET_CLAUDE }}
          TWITTER_ACCESS_TOKEN_CLAUDE: ${{ secrets.TWITTER_ACCESS_TOKEN_CLAUDE }}
          TWITTER_ACCESS_SECRET_CLAUDE: ${{ secrets.TWITTER_ACCESS_SECRET_CLAUDE }}
          TWITTER_API_KEY_TURK: ${{ secrets.TWITTER_API_KEY_TURK }}
          TWITTER_API_SECRET_TURK: ${{ secrets.TWITTER_API_SECRET_TURK }}
          TWITTER_ACCESS_TOKEN_TURK: ${{ secrets.TWITTER_ACCESS_TOKEN_TURK }}
          TWITTER_ACCESS_SECRET_TURK: ${{ secrets.TWITTER_ACCESS_SECRET_TURK }}
          DRY_RUN: "0"
        run: |
          node bot_gpt.js
          node bot_claude.js
          node bot_claude_turk.js

      - name: commit tweet history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tweet_history.json tweet_history_gpt.json tweet_history_turk.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "update tweet history [skip ci]"
          git push