name: post-to-x

on:
  schedule:
    - cron: "0 4,6,8,10,12,14,16,18,20 * * *"  # 8x/day, UTC. change as you like
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: tweet-bot
      cancel-in-progress: false

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20              # NO cache. no drama.

      - name: install deps
        run: npm install                # works even if no lockfile

      - name: random sleep (0–90s)
        run: sleep $(( RANDOM % 90 ))  # jitter so posts aren't to-the-minute

- name: run bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TWITTER_API_KEY_GPT: ${{ secrets.TWITTER_API_KEY_GPT }}
          TWITTER_API_SECRET_GPT: ${{ secrets.TWITTER_API_SECRET_GPT }}
          TWITTER_ACCESS_TOKEN_GPT: ${{ secrets.TWITTER_ACCESS_TOKEN_GPT }}
          TWITTER_ACCESS_SECRET_GPT: ${{ secrets.TWITTER_ACCESS_SECRET_GPT }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          TWITTER_API_KEY_CLAUDE: ${{ secrets.TWITTER_API_KEY_CLAUDE }}
          TWITTER_API_SECRET_CLAUDE: ${{ secrets.TWITTER_API_SECRET_CLAUDE }}
          TWITTER_ACCESS_TOKEN_CLAUDE: ${{ secrets.TWITTER_ACCESS_TOKEN_CLAUDE }}
          TWITTER_ACCESS_SECRET_CLAUDE: ${{ secrets.TWITTER_ACCESS_SECRET_CLAUDE }}
          DRY_RUN: "0"
        run: |
          node bot_gpt.js
          node bot_claude.js