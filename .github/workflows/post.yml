name: post-to-x

on:
  schedule:
    - cron: "0 6,8,10,12,14,16,18,20 * * *"  # 8x/day, UTC. change as you like
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: tweet-bot
      cancel-in-progress: false

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20              # NO cache. no drama.

      - name: install deps
        run: npm install                # works even if no lockfile

      - name: random sleep (0–900s)
        run: sleep $(( RANDOM % 900 ))  # jitter so posts aren't to-the-minute

      - name: run bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TWITTER_APP_KEY: ${{ secrets.TWITTER_APP_KEY }}
          TWITTER_APP_SECRET: ${{ secrets.TWITTER_APP_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          DRY_RUN: "0"                  # set "1" if you want dry runs
        run: npm start
